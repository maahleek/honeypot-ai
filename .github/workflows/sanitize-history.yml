name: Build sanitized honeypot history

on:
  push:
    branches:
      - honeypot-hardening

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          ref: honeypot-hardening
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch both branches
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main --force
          git fetch origin +refs/heads/honeypot-hardening:refs/remotes/origin/honeypot-hardening --force
          git branch -f main origin/main
          git checkout honeypot-hardening

      - name: Preserve cleaned published dataset
        run: cp data/dataset.csv /tmp/honeypot-dataset.csv

      - name: Install git-filter-repo
        run: python -m pip install git-filter-repo

      - name: Remove sensitive runtime data from repository history
        run: |
          git filter-repo --force \
            --path logs/attacks.jsonl \
            --path data/honeypot.db \
            --path data/honeypot.db-shm \
            --path data/honeypot.db-wal \
            --path data/dataset.csv \
            --invert-paths

      - name: Verify removed paths are unreachable
        shell: bash
        run: |
          if git rev-list --all --objects | grep -Eq ' (logs/attacks\.jsonl|data/honeypot\.db|data/honeypot\.db-shm|data/honeypot\.db-wal|data/dataset\.csv)$'; then
            echo "Sensitive historical paths are still reachable."
            exit 1
          fi

      - name: Restore sanitized dataset only to hardening branch
        run: |
          git checkout honeypot-hardening
          mkdir -p data
          cp /tmp/honeypot-dataset.csv data/dataset.csv
          if head -n 1 data/dataset.csv | grep -q 'attacker_ip'; then
            echo "Sanitized dataset unexpectedly contains attacker_ip."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dataset.csv
          git commit -m "Restore sanitized public honeypot dataset"

      - name: Remove one-time sanitizer from cleaned branch
        run: |
          git rm .github/workflows/sanitize-history.yml
          git commit -m "Remove one-time honeypot history sanitizer"

      - name: Publish sanitized refs for verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote remove origin || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin refs/heads/main:refs/heads/sanitized-main-history
          git push origin refs/heads/honeypot-hardening:refs/heads/sanitized-honeypot-history
